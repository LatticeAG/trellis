[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trellis-sdk"
version = "1.0.0"
description = "Python SDK client for the Trellis local watchdog"
license = { text = "MIT" }
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["trellis_sdk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
